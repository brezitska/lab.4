
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>П'ять горизонтальних рядків</title>
</head>

<body bgcolor="#FFF5E6">

<h1 align="center">Горизонтальні рядки, що біжать</h1>

<marquee width="100%" height="50"
bgcolor="#FFB6C1" behavior="alternate">
<font color="#800080" face="Verdana" size="4">
<b>Навчання відкриває нові можливості!</b>
</font>
</marquee>

<br><br>

<marquee width="100%" height="50"
bgcolor="#ADD8E6" direction="left"
behavior="scroll">
<font color="#000080" face="Arial" size="4">
Світ технологій постійно розвивається!
</font>
</marquee>

<br><br>

<marquee width="100%" height="50"
bgcolor="#98FB98" direction="right"
behavior="slide">
<font color="#006400" face="Georgia" size="4">
Програмування — це цікаво!
</font>
</marquee>

<br><br>

<marquee width="100%" height="50"
bgcolor="#FFDAB9" direction="left"
scrolldelay="50">
<font color="#8B4513" face="Verdana" size="4">
Практика допомагає закріпити знання!
</font>
</marquee>

<br><br>

<marquee width="100%" height="50"
bgcolor="#DDA0DD" direction="left"
scrolldelay="300">
<font color="#4B0082" face="Arial" size="4">
Кожен день приносить нові відкриття!
</font>
</marquee>

</body>
</html>
