
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>П'ять вертикальних рядків</title>
</head>

<body bgcolor="#FFF5E6">

<h1 align="center">Вертикальні рядки, що біжать</h1>

<div style="display:flex; gap:15px; justify-content:center;">

<marquee direction="up" behavior="alternate"
width="200" height="300" bgcolor="#FFB6C1">
<center>
<font color="purple" size="4">
<b>Навчання — це розвиток!</b><br><br>
<img src="image/picture1.jpg" width="60">
</font>
</center>
</marquee>

<marquee direction="up" behavior="scroll"
width="200" height="300" bgcolor="#ADD8E6">
<center>
<img src="image/picture1.jpg" width="60"><br><br>
<img src="image/picture1.jpg" width="60"><br><br>
<img src="image/picture1.jpg" width="60">
</center>
</marquee>

<marquee direction="down" behavior="slide"
width="200" height="300" bgcolor="#98FB98">
<center>
<img src="image/picture1.jpg" width="60"><br><br>
<img src="image/picture1.jpg" width="60">
</center>
</marquee>

<marquee direction="up" behavior="scroll"
scrolldelay="50"
width="200" height="300" bgcolor="#FFDAB9">
<center>
<font color="brown" size="4">
Програмування — це цікаво!
</font>
</center>
</marquee>

<marquee direction="down" behavior="scroll"
scrolldelay="300"
width="200" height="300" bgcolor="#DDA0DD">
<center>
<font color="purple" size="4">
Кожен день — нові знання!
</font>
</center>
</marquee>

</div>

</body>
</html>
